[package]
name = "cargo-ai"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
clap = "4.5.35"
futures = "0.3.31"
jsonlogic = "0.5.1"
mockito = "1.7.0"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
dirs = "6.0.0"
toml = "0.9.8"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }

[build-dependencies]
serde_json = "1.0"
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
time = { version = "0.3.41", default-features = false, features = ["formatting", "std"] }
uuid = { version = "1.21.0", default-features = false, features = ["std", "v4"] }
