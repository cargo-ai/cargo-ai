[package]
name = "cargo-ai"
version = "0.0.5"
edition = "2021"
license = "MIT"
description = "Ship AI Data the right way with Rust."
build = "build.rs"
include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    ".agentcfg",
    "src/templates/**",
]

[dependencies]
clap = "4.5.35"
futures = "0.3.31"
jsonlogic = "0.5.1"
mockito = "1.7.0"
reqwest = { version = "0.12.15", features = ["json"] }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }

[build-dependencies]
serde_json = "1.0"
