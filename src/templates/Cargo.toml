[package]
name = "cargo-ai"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clap = "4.5.35"
futures = "0.3.31"
jsonlogic = "0.5.1"
mockito = "1.7.0"
reqwest = { version = "0.12.15", features = ["json"] }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }

[build-dependencies]
serde_json = "1.0"