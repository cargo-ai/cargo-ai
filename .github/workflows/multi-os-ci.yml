name: Core CI

on:
  workflow_dispatch:
    inputs:
      cargo_ai_sha:
        description: Expected commit of the selected workflow ref (defaults to its snapshot)
        required: false
        type: string
      emit_summary:
        description: Emit the standalone deterministic summary job
        required: false
        default: true
        type: boolean
      collect_all:
        description: Keep every operating-system job running after a failure
        required: false
        default: false
        type: boolean
      focused_build_inventory:
        description: Run only affected Windows tool-build inventory checks
        required: false
        default: false
        type: boolean
      diagnostic_toolchain_comparison:
        description: Collect temporary toolchain diagnostics without qualification credit
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      cargo_ai_sha:
        description: Expected commit of the selected workflow ref
        required: false
        type: string
      emit_summary:
        description: Emit the standalone deterministic summary job
        required: false
        default: true
        type: boolean
      collect_all:
        description: Keep every operating-system job running after a failure
        required: false
        default: false
        type: boolean
      focused_build_inventory:
        description: Run only affected Windows tool-build inventory checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deterministic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.focused_build_inventory && '-build-inventory' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_toolchain_comparison && '-toolchain-diagnostic' || '' }}
  cancel-in-progress: false

env:
  CARGO_AI_DISABLE_KEYCHAIN: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnostic_toolchain_comparison) }}
    name: ${{ matrix.stage }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: ${{ ! inputs.collect_all }}
      matrix:
        os: ${{ fromJSON(inputs.focused_build_inventory && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        stage: ${{ fromJSON(inputs.focused_build_inventory && '["Deterministic tests"]' || '["Deterministic tests","Generated provider parity","Installation qualification"]') }}
    steps:
      - name: Validate exact Cargo AI candidate
        shell: bash
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CARGO_AI_SHA" == "$GITHUB_SHA" ]] || { echo "Expected candidate differs from workflow ref; select its branch or tag." >&2; exit 1; }

      - name: Check out exact Cargo AI candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02

      - name: Configure isolated test state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-user-home" "$RUNNER_TEMP/cargo-home"
          {
            echo "HOME=$RUNNER_TEMP/test-user-home"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "RUSTUP_HOME=${RUSTUP_HOME:-${USERPROFILE:-$HOME}/.rustup}"
            echo "RUST_TEST_THREADS=1"
          } >> "$GITHUB_ENV"

      - name: Check qualification policy
        if: ${{ matrix.stage == 'Deterministic tests' }}
        run: cargo test --locked --test qualification_policy

      - name: Check formatting
        if: ${{ matrix.stage == 'Deterministic tests' }}
        run: cargo fmt --all -- --check

      - name: Check all targets
        if: ${{ matrix.stage == 'Deterministic tests' }}
        run: cargo check --locked --all-targets

      - name: Run deterministic test suite
        if: ${{ matrix.stage == 'Deterministic tests' && ! inputs.focused_build_inventory }}
        run: cargo test --locked --all-targets

      - name: Run affected tool-build inventory checks
        if: ${{ inputs.focused_build_inventory }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --bin cargo-ai commands::tools::tests -- --nocapture
          cargo test --locked --test native_role_runtime native_target_build_preserves_source_backed_role_tool_inventory -- --exact --nocapture

      - name: Run generated provider parity
        if: ${{ matrix.stage == 'Generated provider parity' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test provider_smoke generated_provider_batch_isolated_and_deterministic -- --ignored --exact --nocapture
          cargo test --locked --test native_role_runtime emitted_native_role_root_media_and_child_dispatch_are_scoped -- --ignored --exact --nocapture
          cargo test --locked --test native_role_runtime emitted_native_role_overlapping_children_retain_nested_permit_lineage -- --ignored --exact --nocapture
          cargo test --locked --test native_role_runtime emitted_native_nested_child_paths_are_portable -- --ignored --exact --nocapture

      - name: Build candidate CLI
        if: ${{ matrix.stage == 'Installation qualification' }}
        run: cargo build --locked

      - name: Install candidate CLI into runner-local root
        if: ${{ matrix.stage == 'Installation qualification' }}
        run: cargo install --locked --path . --root "${{ runner.temp }}/cargo-ai-install"

      - name: Smoke installed CLI
        if: ${{ matrix.stage == 'Installation qualification' }}
        shell: bash
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/cargo-ai-install/bin/cargo-ai"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="${cli}.exe"; fi
          "$cli" --no-update-check version
          "$cli" --no-update-check hatch adder_test --check

      - name: Install freshly resolved packaged source
        if: ${{ matrix.stage == 'Installation qualification' }}
        shell: bash
        run: |
          set -euo pipefail
          lane="$(cd "$RUNNER_TEMP" && pwd -P)/packaged-install"
          evidence="$lane/evidence"
          mkdir -p "$evidence" "$lane/source" "$lane/cargo-home" "$lane/home"
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cargo-ai") | .version')
          candidate=$(git rev-parse HEAD)
          host=$(rustc -vV | sed -n 's/^host: //p')
          [[ -n "$version" && -n "$host" ]]
          cargo package --locked --no-verify --target-dir "$lane/package-target"
          archive="$lane/package-target/package/cargo-ai-$version.crate"
          tar -xzf "$archive" -C "$lane/source"
          source="$lane/source/cargo-ai-$version"
          [[ "$(jq -r '.git.sha1' "$source/.cargo_vcs_info.json")" == "$candidate" ]]
          cp "$source/Cargo.lock" "$evidence/packaged.Cargo.lock"
          cp "$source/.cargo_vcs_info.json" "$evidence/source.json"
          rm "$source/Cargo.lock"

          export CARGO_HOME="$lane/cargo-home"
          export CARGO_TARGET_DIR="$lane/build"
          export CARGO_AI_HOME="$lane/home"
          cd "$source"
          cargo generate-lockfile
          cp Cargo.lock "$evidence/resolved.Cargo.lock"
          cargo metadata --locked --format-version 1 --filter-platform "$host" > "$evidence/resolved-metadata.json"
          cargo tree --locked --edges normal,build --target "$host" > "$evidence/install-dependencies.txt"
          {
            echo "candidate=$candidate"
            echo "version=$version"
            echo "platform=$RUNNER_OS"
            echo "observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            rustc -vV
            cargo -vV
          } > "$evidence/identity.txt"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$archive" "$evidence/packaged.Cargo.lock" "$evidence/resolved.Cargo.lock" > "$evidence/sha256.txt"
          else
            sha256sum "$archive" "$evidence/packaged.Cargo.lock" "$evidence/resolved.Cargo.lock" > "$evidence/sha256.txt"
          fi
          # Bind the build to the newly resolved graph, never the packaged lock.
          # This is packaged-source proof; plain registry installation is separate.
          cargo install --locked --path . --root "$lane/install" --target "$host"
          cmp Cargo.lock "$evidence/resolved.Cargo.lock"
          # Generated workspaces need their own target directories during smoke checks.
          unset CARGO_TARGET_DIR
          cli="$lane/install/bin/cargo-ai"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="${cli}.exe"; fi
          export PATH="$lane/install/bin:$PATH"
          resolved_cli=$(command -v cargo-ai)
          [[ "${resolved_cli%.exe}" == "${cli%.exe}" ]]
          [[ "$("$cli" --no-update-check version)" == "$version" ]]
          [[ "$(cargo ai --no-update-check version)" == "$version" ]]
          "$cli" --no-update-check hatch adder_test --config "$source/.agentcfg" --check
          "$cli" --no-update-check new "$lane/project" --vcs none
          cd "$lane/project"
          cargo ai --no-update-check add guidance --style codex
          test -s .cargo-ai/guidance/start-here.md
          cat > smoke.json <<'JSON'
          {
            "agent_definition_schema_version": "2026-09-09.r1",
            "inputs": [{"name": "job", "type": "text", "text": "local installation check"}],
            "agent_schema": {"type": "object", "properties": {}},
            "actions": [{"name": "cargo_version", "logic": {"==": [1, 1]}, "run": [{"kind": "exec", "program": "cargo", "args": ["--version"]}]}]
          }
          JSON
          cargo ai --no-update-check run --config smoke.json --server ollama --model install-smoke --render-mode append-only | tee "$evidence/smoke.txt"
          grep -q 'cargo [0-9]' "$evidence/smoke.txt"
          echo "Packaged-source fresh-resolution install, Cargo dispatch, guidance and local action passed." >> "$evidence/identity.txt"

      - name: Preserve packaged installation evidence
        if: ${{ always() && matrix.stage == 'Installation qualification' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-install-${{ matrix.os }}
          path: ${{ runner.temp }}/packaged-install/evidence/
          if-no-files-found: warn
          retention-days: 14


  toolchain_diagnostic:
    name: Diagnostic evidence only (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_toolchain_comparison }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out diagnostic workflow candidate
        timeout-minutes: 3
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare retained generated workspaces
        timeout-minutes: 50
        shell: bash
        env:
          EXPECTED_CANDIDATE: ${{ inputs.cargo_ai_sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import stat
          import subprocess
          import sys
          import tarfile
          import time
          import traceback

          started = time.monotonic()
          deadline = started + 47 * 60
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          evidence = runner_temp / "toolchain-diagnostic" / "evidence"
          evidence.mkdir(parents=True, exist_ok=True)
          work = runner_temp / "td"
          windows = os.name == "nt"
          result = {
              "status": "incomplete", "qualification_credit": False,
              "candidate": os.environ["GITHUB_SHA"],
              "platform": os.environ["RUNNER_OS"],
              "image": {key: os.environ.get(key) for key in ("ImageOS", "ImageVersion")},
              "commands": [], "comparisons": [], "short_control": "not reached",
          }
          env = os.environ.copy()

          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def save():
              result["elapsed_seconds"] = round(time.monotonic() - started, 2)
              write_json(evidence / "result.json", result)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def run(label, args, *, cwd=workspace, toolchain="1.99.1", required=True, extra=None):
              # Keep the immediate read-only probe possible after a build uses its budget.
              remaining = deadline + (60 if label == "windows-library-probe" else 0) - time.monotonic()
              if remaining <= 0:
                  raise RuntimeError("Diagnostic time budget exhausted; remaining evidence is incomplete")
              command_env = dict(env, RUSTUP_TOOLCHAIN=toolchain)
              command_env.update(extra or {})
              args = [str(arg) for arg in args]
              executable = shutil.which(args[0], path=command_env.get("PATH"))
              if executable is None:
                  raise RuntimeError(f"Required executable is unavailable: {args[0]}")
              args[0] = executable
              stdout = evidence / f"{label}.stdout"
              stderr = evidence / f"{label}.stderr"
              entry = {
                  "label": label, "args": args, "cwd": str(cwd), "toolchain": toolchain,
                  "started_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "stdout": stdout.name, "stderr": stderr.name, "status": "running",
              }
              result["commands"].append(entry)
              save()
              print(f"Diagnostic command: {label}", flush=True)
              with stdout.open("wb") as out, stderr.open("wb") as err:
                  try:
                      process = subprocess.Popen(
                          args, cwd=cwd, env=command_env, stdout=out, stderr=err,
                          start_new_session=not windows,
                          creationflags=subprocess.CREATE_NEW_PROCESS_GROUP if windows else 0,
                      )
                  except OSError as error:
                      entry.update({"status": "failed to start", "error": str(error)})
                      save()
                      raise
                  try:
                      code = process.wait(timeout=remaining)
                  except subprocess.TimeoutExpired:
                      entry["status"] = "timed out"
                      if windows:
                          killed = subprocess.run(
                              ["taskkill", "/PID", str(process.pid), "/T", "/F"],
                              stdout=out, stderr=err, timeout=30,
                          )
                          entry["tree_stop_exit"] = killed.returncode
                      else:
                          try:
                              os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                      process.wait(timeout=30)
                      entry["exit_code"] = process.returncode
                      save()
                      raise RuntimeError(f"Time budget reached during {label}")
              entry.update({
                  "status": "completed", "exit_code": code,
                  "stdout_sha256": sha256(stdout), "stderr_sha256": sha256(stderr),
              })
              save()
              if required and code != 0:
                  raise RuntimeError(f"Prerequisite {label} failed with exit {code}; no retry")
              return entry

          def output(entry):
              return (evidence / entry["stdout"]).read_text(encoding="utf-8", errors="replace")

          def inventory(root):
              files = {}
              for directory, dirs, names in os.walk(root):
                  if Path(directory) == root:
                      dirs[:] = [name for name in dirs if name != "target"]
                  for name in dirs + names:
                      if (Path(directory) / name).is_symlink():
                          raise RuntimeError("Generated source contains an unexpected symlink")
                  for name in names:
                      path = Path(directory) / name
                      files[path.relative_to(root).as_posix()] = {
                          "bytes": path.stat().st_size, "sha256": sha256(path),
                          "mode": stat.S_IMODE(path.stat().st_mode),
                      }
              if "Cargo.lock" not in files or "Cargo.toml" not in files:
                  raise RuntimeError("Generated workspace lacks its actual manifest or lock")
              return files

          def snapshot(label, root, expected=None):
              files = inventory(root)
              write_json(evidence / f"{label}.source.json", files)
              shutil.copyfile(root / "Cargo.lock", evidence / f"{label}.Cargo.lock")
              shutil.copyfile(root / "Cargo.toml", evidence / f"{label}.Cargo.toml")
              if expected is not None and files != expected:
                  raise RuntimeError(f"Source/lock identity changed at {label}; comparison stopped")
              return files

          def canonical_graph(metadata):
              root_id = metadata["resolve"]["root"]
              def identity(value):
                  return "<root>" if value == root_id else value
              packages = []
              for package in metadata["packages"]:
                  if package["source"] is None and package["id"] != root_id:
                      raise RuntimeError("Unexpected external path package in generated graph")
                  if any(dep.get("path") is not None for dep in package["dependencies"]):
                      raise RuntimeError("Unexpected path dependency in generated graph")
                  packages.append({
                      "id": identity(package["id"]), "name": package["name"],
                      "version": package["version"], "source": package["source"],
                      "dependencies": package["dependencies"], "features": package["features"],
                      "targets": sorted([{
                          "name": target["name"], "kind": target["kind"],
                          "crate_types": target["crate_types"], "edition": target["edition"],
                          "required_features": target.get("required-features"),
                      } for target in package["targets"]], key=lambda target: (target["name"], target["kind"])),
                  })
              nodes = [{
                  "id": identity(node["id"]),
                  "dependencies": sorted(identity(dep) for dep in node["dependencies"]),
                  "deps": sorted([{
                      "name": dep["name"], "pkg": identity(dep["pkg"]), "dep_kinds": dep["dep_kinds"],
                  } for dep in node["deps"]], key=lambda dep: (dep["name"], dep["pkg"])),
                  "features": sorted(node["features"]),
              } for node in metadata["resolve"]["nodes"]]
              return {"packages": sorted(packages, key=lambda item: item["id"]),
                      "nodes": sorted(nodes, key=lambda item: item["id"])}

          def graph(label, root, toolchain):
              entry = run(label, ["cargo", "metadata", "--locked", "--offline", "--format-version", "1",
                                  "--filter-platform", host], cwd=root, toolchain=toolchain)
              metadata = json.loads(output(entry))
              write_json(evidence / f"{label}.metadata.json", metadata)
              normalized = canonical_graph(metadata)
              write_json(evidence / f"{label}.graph.json", normalized)
              return normalized

          def copy_seed(seed, destination, source_files):
              if destination.exists():
                  raise RuntimeError(f"Comparison destination already exists: {destination}")
              destination.mkdir(parents=True)
              for relative in source_files:
                  source = seed / relative
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)

          def probe_missing_library(path, profile, toolchain):
              result["missing_library"] = {"path": path, "characters": len(path), "profile": profile}
              save()
              probe_script = r'''
          $path = $env:DIAG_MISSING_LIBRARY
          $result = [ordered]@{ path = $path; characters = $path.Length; exists = (Test-Path -LiteralPath $path); observation = 'after linker exit' }
          $stream = $null
          try {
              $stream = [System.IO.File]::Open($path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, ([System.IO.FileShare]::ReadWrite -bor [System.IO.FileShare]::Delete))
              $result.opened = $true
              $result.bytes = $stream.Length
              $hasher = [System.Security.Cryptography.SHA256]::Create()
              try { $result.sha256 = [Convert]::ToHexString($hasher.ComputeHash($stream)).ToLowerInvariant() } finally { $hasher.Dispose() }
          } catch {
              $result.opened = $false
              $result.exception = $_.Exception.GetType().FullName
              $result.message = $_.Exception.Message
          } finally { if ($null -ne $stream) { $stream.Dispose() } }
          $result | ConvertTo-Json
          '''
              probe = run("windows-library-probe", ["pwsh", "-NoLogo", "-NoProfile", "-NonInteractive", "-Command", probe_script],
                          toolchain=toolchain, extra={"DIAG_MISSING_LIBRARY": path})
              result["library_probe"] = json.loads(output(probe))
              save()

          def build(label, root, toolchain, profile, source_files, expected_graph):
              args = ["cargo", "build", "--locked", "--offline"]
              if profile == "release":
                  args.append("--release")
              entry = run(label, args, cwd=root, toolchain=toolchain, required=False)
              text = output(entry) + "\n" + (evidence / entry["stderr"]).read_text(encoding="utf-8", errors="replace")
              missing = re.search(r"LNK1104: cannot open file '([^']+)'", text)
              if windows and toolchain == "1.100.0" and label != "short-build" and missing and "missing_library" not in result:
                  probe_missing_library(missing.group(1), profile, toolchain)
              entry["warnings"] = [line for line in text.splitlines() if line.lstrip().startswith("warning")]
              snapshot(f"{label}-after", root, source_files)
              after = graph(f"{label}-after", root, toolchain)
              entry["graph_unchanged"] = after == expected_graph
              save()
              if after != expected_graph:
                  raise RuntimeError(f"Dependency graph changed during {label}; comparison stopped")
              return entry, text

          try:
              save()
              expected = os.environ["EXPECTED_CANDIDATE"]
              if not re.fullmatch("[0-9a-f]{40}", expected) or expected != os.environ["GITHUB_SHA"]:
                  raise RuntimeError("Expected candidate differs from the selected workflow ref")
              actual = output(run("checkout-identity", ["git", "rev-parse", "HEAD"])).strip()
              if actual != expected:
                  raise RuntimeError("Checkout differs from the selected workflow candidate")
              run("source-baseline", ["git", "diff", "--exit-code", "adecba8cd4370724c4cdfa6cb707b9a3494a32ea",
                                       "HEAD", "--", ".", ":(exclude).github/workflows/multi-os-ci.yml"])
              if output(run("clean-checkout", ["git", "status", "--porcelain"])).strip():
                  raise RuntimeError("Diagnostic checkout is not clean")
              work.mkdir(exist_ok=False)
              for name in ("home", "cargo", "rustup", "h"):
                  (work / name).mkdir()
              for key in list(env):
                  if key in ("RUSTFLAGS", "RUSTDOCFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_ENCODED_RUSTDOCFLAGS",
                             "CARGO_BUILD_TARGET", "CARGO_TARGET_DIR", "CARGO_BUILD_TARGET_DIR", "CARGO_BUILD_BUILD_DIR",
                             "RUSTC", "RUSTDOC", "RUSTC_WRAPPER", "RUSTC_WORKSPACE_WRAPPER"):
                      env.pop(key, None)
              env.update({
                  "HOME": str(work / "home"), "USERPROFILE": str(work / "home"),
                  "CARGO_HOME": str(work / "cargo"), "RUSTUP_HOME": str(work / "rustup"),
                  "CARGO_AI_HOME": str(work / "h"), "CARGO_AI_DISABLE_KEYCHAIN": "1",
                  "CARGO_TERM_COLOR": "never", "RUST_TEST_THREADS": "1",
              })
              result["isolated_paths"] = {key: env[key] for key in ("HOME", "CARGO_HOME", "RUSTUP_HOME", "CARGO_AI_HOME")}
              identities = {}
              for version in ("1.99.1", "1.100.0"):
                  run(f"install-{version}", ["rustup", "toolchain", "install", version, "--profile", "minimal"], toolchain=version)
                  identities[version] = output(run(f"rustc-{version}", ["rustc", "-vV"], toolchain=version))
                  run(f"cargo-{version}", ["cargo", "-vV"], toolchain=version)
              hosts = [re.search(r"^host: (.+)$", value, re.MULTILINE).group(1).strip() for value in identities.values()]
              if len(set(hosts)) != 1:
                  raise RuntimeError("Toolchain host targets differ")
              host = hosts[0]
              result["host"] = host
              if windows:
                  vswhere = Path(os.environ["ProgramFiles(x86)"]) / "Microsoft Visual Studio" / "Installer" / "vswhere.exe"
                  discovered = run("linker-discovery", [vswhere, "-latest", "-products", "*", "-find", r"VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe"])
                  linkers = [Path(line.strip()) for line in output(discovered).splitlines() if line.strip()]
                  if not linkers or not all(path.is_file() for path in linkers):
                      raise RuntimeError("Native MSVC linker identity could not be established")
                  result["linker_candidates"] = [{"path": str(path), "sha256": sha256(path)} for path in linkers]
              run("build-emitter", ["cargo", "build", "--locked", "--bin", "cargo-ai", "--target-dir", work / "cli"])
              cli = work / "cli" / "debug" / ("cargo-ai.exe" if windows else "cargo-ai")
              cli_hash = sha256(cli)
              result["emitter_sha256"] = cli_hash
              run("emit-seed", [cli, "--no-update-check", "hatch", "toolchain_probe", "--config",
                                workspace / ".agentcfg", "--output-dir", work / "dist", "--keep-project"])
              if sha256(cli) != cli_hash:
                  raise RuntimeError("Emitter identity changed")
              template = work / "h" / "templates" / cli_hash / "rustc-1.99.1" / host / "release"
              application = work / "h" / "agents" / "toolchain_probe"
              seeds = {}
              for kind, root in (("template", template), ("application", application)):
                  files = snapshot(f"seed-{kind}", root)
                  run(f"fetch-seed-{kind}", ["cargo", "fetch", "--locked", "--target", host], cwd=root)
                  snapshot(f"seed-{kind}-after-fetch", root, files)
                  with tarfile.open(evidence / f"seed-{kind}.tar.gz", "w:gz") as archive:
                      for relative in sorted(files):
                          archive.add(root / relative, arcname=relative, recursive=False)
                  seeds[kind] = (root, files)
              kind = "template" if windows else "application"
              seed, source_files = seeds[kind]
              seed_graph = graph(f"seed-{kind}", seed, "1.99.1")
              snapshot(f"seed-{kind}-after-metadata", seed, source_files)
              profiles = ("release", "dev") if windows else ("release",)
              parent = work / "comparison"
              if windows:
                  def predicted_path(base, profile):
                      folder = "release" if profile == "release" else "debug"
                      return base / "target" / folder / "build" / "fallible-streaming-iterator" / ("0" * 16) / "out" / ("libfallible_streaming_iterator-" + "0" * 16 + ".rlib")
                  padding = 0
                  while True:
                      parent = work / ("comparison" + "_" * padding)
                      predictions = {}
                      for profile, minimum in (("release", 266), ("dev", 268)):
                          base = parent / "new___" / "templates" / cli_hash / "rustc-control" / host / profile
                          predictions[profile] = {"path": str(predicted_path(base, profile)), "minimum": minimum}
                          predictions[profile]["characters"] = len(predictions[profile]["path"])
                      if all(value["characters"] >= value["minimum"] for value in predictions.values()):
                          break
                      padding += 1
                  result["long_path_predictions"] = predictions
              short_used = False
              for profile in profiles:
                  pair = {"profile": profile, "kind": kind, "status": "preparing", "roots": {}, "builds": []}
                  result["comparisons"].append(pair)
                  roots, graphs = {}, {}
                  for label, version in (("old___", "1.99.1"), ("new___", "1.100.0")):
                      root = parent / label
                      root = root / "templates" / cli_hash / "rustc-control" / host / profile if windows else root / "app"
                      roots[version] = root
                      pair["roots"][version] = str(root)
                      copy_seed(seed, root, source_files)
                      snapshot(f"{profile}-{version}-before", root, source_files)
                      graphs[version] = graph(f"{profile}-{version}-before", root, version)
                      snapshot(f"{profile}-{version}-after-metadata", root, source_files)
                  if len(str(roots["1.99.1"])) != len(str(roots["1.100.0"])):
                      raise RuntimeError("Paired root lengths differ")
                  pair["same_graph"] = graphs["1.99.1"] == graphs["1.100.0"] == seed_graph
                  save()
                  if not pair["same_graph"]:
                      raise RuntimeError("Generated dependency graphs differ; paired builds not started")
                  for version in ("1.99.1", "1.100.0"):
                      entry, text = build(f"{profile}-{version}-build", roots[version], version, profile, source_files, seed_graph)
                      pair["builds"].append({"toolchain": version, "exit_code": entry["exit_code"], "label": entry["label"]})
                      missing = re.search(r"LNK1104: cannot open file '([^']+)'", text)
                      if windows and version == "1.100.0" and missing and not short_used:
                          short_used = True
                          result["short_control"] = "preparing"
                          save()
                          short = runner_temp / "s"
                          copy_seed(seed, short, source_files)
                          snapshot("short-before", short, source_files)
                          short_graph = graph("short-before", short, version)
                          snapshot("short-after-metadata", short, source_files)
                          if short_graph != seed_graph:
                              raise RuntimeError("Short-root graph differs; control not started")
                          control, control_text = build("short-build", short, version, profile, source_files, seed_graph)
                          control_missing = re.search(r"LNK1104: cannot open file '([^']+)'", control_text)
                          result["short_control"] = {
                              "root": str(short), "profile": profile, "exit_code": control["exit_code"],
                              "same_source_lock_graph": True,
                              "missing_library": control_missing.group(1) if control_missing else None,
                              "predicted_library_characters": len(str(predicted_path(short, profile))),
                          }
                          save()
                  pair["status"] = "observations collected"
                  save()
              if not short_used:
                  result["short_control"] = "not applicable: no matching Windows current-toolchain linker failure"
              result["status"] = "diagnostic observations collected; no qualification credit"
          except Exception as error:
              result["error"] = f"{type(error).__name__}: {error}"
              (evidence / "exception.txt").write_text(traceback.format_exc(), encoding="utf-8")
              print(result["error"], flush=True)
          finally:
              save()
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Diagnostic evidence only\n\n")
                  summary.write(result["status"] + ". This run does not establish Core qualification, provider parity or a corrected product.\n")
                  if "error" in result:
                      summary.write("A prerequisite or evidence check stopped the comparison; see the retained result and logs.\n")
          sys.exit(1 if "error" in result else 0)
          PY

      - name: Preserve diagnostic observations
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolchain-diagnostic-${{ matrix.os }}
          path: ${{ runner.temp }}/toolchain-diagnostic/evidence/
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Deterministic qualification summary
    if: ${{ always() && inputs.emit_summary && !(github.event_name == 'workflow_dispatch' && inputs.diagnostic_toolchain_comparison) }}
    needs: [deterministic]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected stage
        env:
          MATRIX_RESULT: ${{ needs.deterministic.result }}
          FOCUSED_BUILD_INVENTORY: ${{ inputs.focused_build_inventory }}
        run: |
          test "$MATRIX_RESULT" = "success"
          if [[ "$FOCUSED_BUILD_INVENTORY" == "true" ]]; then
            echo "Focused credential-free Windows tool-build inventory checks passed. This is affected proof, not a full Core CI matrix." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Credential-free deterministic qualification passed on Ubuntu, macOS, and Windows." >> "$GITHUB_STEP_SUMMARY"
          fi
