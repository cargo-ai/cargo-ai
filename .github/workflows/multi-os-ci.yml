name: Multi-OS CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:  # allows manual ad hoc runs from GitHub UI
    inputs:
      run_live_openai_smoke:
        description: "Run provider-backed OpenAI smoke checks after the local hatch smoke"
        required: false
        type: boolean
        default: false
      run_live_anthropic_smoke:
        description: "Run the isolated live Anthropic smoke after deterministic provider checks"
        required: false
        type: boolean
        default: false
      anthropic_model:
        description: "Anthropic model ID for the opt-in live smoke"
        required: false
        type: string
        default: "claude-sonnet-5"
      run_live_gemini_smoke:
        description: "Run the isolated live Gemini smoke after deterministic provider checks"
        required: false
        type: boolean
        default: false
      gemini_model:
        description: "Gemini model ID for the opt-in live smoke"
        required: false
        type: string
        default: "gemini-3.6-flash"
      run_live_mistral_smoke:
        description: "Run the isolated live Mistral API smoke after deterministic provider checks"
        required: false
        type: boolean
        default: false
      mistral_model:
        description: "Operator-selected Mistral model ID for the opt-in integration smoke"
        required: false
        type: string
        default: ""
      run_live_xai_smoke:
        description: "Run the isolated live xAI smoke after deterministic provider checks"
        required: false
        type: boolean
        default: false
      xai_model:
        description: "Operator-selected xAI model ID for the opt-in integration smoke"
        required: false
        type: string
        default: ""

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.gemini_model }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: ${{ inputs.mistral_model }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ inputs.xai_model }}

    strategy:
      # Prevents one OS job failure (e.g., Ubuntu) from canceling all matrix jobs
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check project
        run: cargo check --all-targets

      - name: Run test suite
        run: cargo test --all-targets

      - name: Run generated Anthropic provider smoke
        run: cargo test --test provider_smoke generated_anthropic_smoke_isolated_and_deterministic -- --ignored --exact

      - name: Run generated Gemini provider smoke
        run: cargo test --test provider_smoke generated_gemini_smoke_isolated_and_deterministic -- --ignored --exact

      - name: Run generated Mistral provider smoke
        run: cargo test --test provider_smoke generated_mistral_smoke_isolated_and_deterministic -- --ignored --exact

      - name: Run generated xAI provider smoke
        run: cargo test --test provider_smoke generated_xai_smoke_isolated_and_deterministic -- --ignored --exact

      - name: Build project
        run: cargo build --verbose

      - name: Install CLI for cargo-ai
        run: cargo install --path .

      - name: Run smoke test via installed CLI
        run: cargo ai hatch adder_test

      - name: Note live OpenAI smoke policy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_live_openai_smoke }}" == "true" ]]; then
            if [[ -n "$OPENAI_API_KEY" ]]; then
              echo "Live OpenAI smoke is enabled for this manual run."
            else
              echo "Live OpenAI smoke was requested, but OPENAI_API_KEY is not configured; skipping provider-backed checks."
            fi
          else
            echo "Skipping live OpenAI smoke on the default push matrix; build, install, and hatch smoke remain required."
          fi
        shell: bash

      - name: Note live Anthropic smoke policy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_live_anthropic_smoke }}" == "true" ]]; then
            if [[ -n "$ANTHROPIC_API_KEY" && -n "$ANTHROPIC_MODEL" ]]; then
              echo "Live Anthropic smoke is enabled for this manual run."
            else
              echo "Live Anthropic smoke was requested, but ANTHROPIC_API_KEY or the model input is missing; skipping it."
            fi
          else
            echo "Skipping live Anthropic smoke; deterministic interpreted and generated provider checks remain required."
          fi
        shell: bash

      - name: Run isolated live Anthropic smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_anthropic_smoke == true && env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_MODEL != '' }}
        run: cargo test --test provider_smoke live_anthropic_smoke_uses_isolated_stdin_credentials -- --ignored --exact

      - name: Note live Gemini smoke policy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_live_gemini_smoke }}" == "true" ]]; then
            if [[ -n "$GEMINI_API_KEY" && -n "$GEMINI_MODEL" ]]; then
              echo "Live Gemini smoke is enabled for this manual run."
            else
              echo "Live Gemini smoke was requested, but GEMINI_API_KEY or the model input is missing; skipping it."
            fi
          else
            echo "Skipping live Gemini smoke; deterministic interpreted and generated provider checks remain required."
          fi
        shell: bash

      - name: Run isolated live Gemini smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_gemini_smoke == true && env.GEMINI_API_KEY != '' && env.GEMINI_MODEL != '' }}
        run: cargo test --test provider_smoke live_gemini_smoke_uses_isolated_stdin_credentials -- --ignored --exact

      - name: Note live Mistral smoke policy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_live_mistral_smoke }}" == "true" ]]; then
            if [[ -n "$MISTRAL_API_KEY" && -n "$MISTRAL_MODEL" ]]; then
              echo "Live Mistral integration smoke is enabled for this manual run."
            else
              echo "Live Mistral smoke was requested, but MISTRAL_API_KEY or the operator-selected model is missing; skipping it."
            fi
          else
            echo "Skipping live Mistral smoke; deterministic interpreted and generated provider checks remain required."
          fi
        shell: bash

      - name: Run isolated live Mistral smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_mistral_smoke == true && env.MISTRAL_API_KEY != '' && env.MISTRAL_MODEL != '' }}
        run: cargo test --test provider_smoke live_mistral_smoke_uses_isolated_stdin_credentials -- --ignored --exact

      - name: Note live xAI smoke policy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_live_xai_smoke }}" == "true" ]]; then
            if [[ -n "$XAI_API_KEY" && -n "$XAI_MODEL" ]]; then
              echo "Live xAI integration smoke is enabled for this manual run."
            else
              echo "Live xAI smoke was requested, but XAI_API_KEY or the operator-selected model is missing; skipping it."
            fi
          else
            echo "Skipping live xAI smoke; deterministic interpreted and generated provider checks remain required."
          fi
        shell: bash

      - name: Run isolated live xAI smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_xai_smoke == true && env.XAI_API_KEY != '' && env.XAI_MODEL != '' }}
        run: cargo test --test provider_smoke live_xai_smoke_uses_isolated_stdin_credentials -- --ignored --exact

      - name: Run agent_adder with OpenAI token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_openai_smoke == true && env.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./adder_test.exe -s openai -m gpt-4o --token "$OPENAI_API_KEY"
          else
            ./adder_test -s openai -m gpt-4o --token "$OPENAI_API_KEY"
          fi
        shell: bash

      - name: Validate agent_adder output with default prompt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_openai_smoke == true && env.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            OUTPUT=$(./adder_test.exe -s openai -m gpt-4o --token "$OPENAI_API_KEY")
          else
            OUTPUT=$(./adder_test -s openai -m gpt-4o --token "$OPENAI_API_KEY")
          fi

          echo "$OUTPUT"

          echo "$OUTPUT" | grep -q "Value return is equal to 4." || {
            echo "❌ Expected output not found"
            exit 1
          }
        shell: bash

      - name: Validate agent_adder output with overridden text input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_openai_smoke == true && env.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            OUTPUT=$(./adder_test.exe -s openai -m gpt-4o --token "$OPENAI_API_KEY" --input-text "What is 2 + 3? Return the answer as a number.")
          else
            OUTPUT=$(./adder_test -s openai -m gpt-4o --token "$OPENAI_API_KEY" --input-text "What is 2 + 3? Return the answer as a number.")
          fi

          echo "$OUTPUT"

          echo "$OUTPUT" | grep -q "Value return is not equal to 4." || {
            echo "❌ Expected output for overridden prompt not found"
            exit 1
          }
        shell: bash
