name: Multi-OS CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      cargo_ai_sha:
        description: Exact Cargo AI commit to qualify (defaults to the triggering commit)
        required: false
        type: string
      emit_summary:
        description: Emit the standalone deterministic summary job
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      cargo_ai_sha:
        description: Exact Cargo AI commit to qualify
        required: false
        type: string
      emit_summary:
        description: Emit the standalone deterministic summary job
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deterministic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_AI_DISABLE_KEYCHAIN: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deterministic:
    name: Deterministic qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out exact Cargo AI candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02

      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run deterministic test suite
        run: cargo test --all-targets

      - name: Run generated provider parity
        shell: bash
        run: |
          set -euo pipefail
          for test_name in \
            generated_anthropic_smoke_isolated_and_deterministic \
            generated_gemini_smoke_isolated_and_deterministic \
            generated_mistral_smoke_isolated_and_deterministic \
            generated_xai_smoke_isolated_and_deterministic \
            generated_openai_smoke_isolated_and_deterministic \
            generated_ollama_smoke_isolated_and_deterministic
          do
            cargo test --test provider_smoke "$test_name" -- --ignored --exact
          done

      - name: Build candidate CLI
        run: cargo build --locked

      - name: Install candidate CLI into runner-local root
        run: cargo install --locked --path . --root "${{ runner.temp }}/cargo-ai-install"

      - name: Smoke installed CLI
        shell: bash
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/cargo-ai-install/bin/cargo-ai"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="${cli}.exe"; fi
          "$cli" --no-update-check version
          "$cli" --no-update-check hatch adder_test --check

  summary:
    name: Deterministic qualification summary
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push' || inputs.emit_summary) }}
    needs: [deterministic]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every operating system
        env:
          MATRIX_RESULT: ${{ needs.deterministic.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
          echo "Credential-free deterministic qualification passed on Ubuntu, macOS, and Windows." >> "$GITHUB_STEP_SUMMARY"
