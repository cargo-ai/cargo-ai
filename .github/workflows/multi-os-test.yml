name: Multi OS Test

on:
  push:
    branches:
      - main
      - develop
      - CAI-116-Cargo-AI-Cross-Platform-CI-Workflow
  workflow_dispatch:  # allows manual ad hoc runs from GitHub UI

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build project
        run: cargo build --verbose

      - name: Install CLI for cargo-ai
        run: cargo install --path .

      - name: Run smoke test via installed CLI
        run: cargo ai hatch agent_adder