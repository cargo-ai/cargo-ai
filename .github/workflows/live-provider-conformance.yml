          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CARGO_AI_SHA" == "$TRUSTED_TRIGGER_SHA" ]] || { echo "Expected candidate differs from workflow ref; select its branch or tag." >&2; exit 1; }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Gemini check
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model || vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${GEMINI_API_KEY:-}" ]] || { echo "GEMINI_API_KEY is required for enrolled Gemini" >&2; exit 1; }
          [[ -n "${GEMINI_MODEL:-}" ]] || { echo "GEMINI_MODEL is required for enrolled Gemini" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe gemini

  xai:
    name: Live xAI conformance
    if: ${{ inputs.provider == 'xai' || (inputs.provider == 'all' && vars.LIVE_XAI_ENABLED != '' && vars.LIVE_XAI_ENABLED != 'false') }}
