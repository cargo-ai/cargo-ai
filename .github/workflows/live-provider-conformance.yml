name: Live Provider Conformance

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Hosted provider to validate
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic
          - gemini
          - xai
          - mistral
          - typesafe
          - all
      cargo_ai_sha:
        description: Expected commit of the selected workflow ref (defaults to its snapshot)
        required: false
        type: string
      openai_model:
        required: false
        type: string
      anthropic_model:
        required: false
        type: string
      gemini_model:
        required: false
        type: string
      xai_model:
        required: false
        type: string
      mistral_model:
        required: false
        type: string
      typesafe_model:
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: live-provider-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_AI_DISABLE_KEYCHAIN: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  openai:
    name: Live OpenAI conformance
    if: ${{ inputs.provider == 'openai' || inputs.provider == 'all' || !contains(fromJSON('["openai","anthropic","gemini","xai","mistral","typesafe","all"]'), inputs.provider) }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    steps:
      - name: Validate provider selection
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            openai|anthropic|gemini|xai|mistral|typesafe|all) ;;
            *) echo "provider must be openai, anthropic, gemini, xai, mistral, typesafe, or all" >&2; exit 1 ;;
          esac
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CARGO_AI_SHA" == "$TRUSTED_TRIGGER_SHA" ]] || { echo "Expected candidate differs from workflow ref; select its branch or tag." >&2; exit 1; }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative OpenAI check
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai_model || vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo "OPENAI_API_KEY is required" >&2; exit 1; }
          [[ -n "${OPENAI_MODEL:-}" ]] || { echo "OPENAI_MODEL is required" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe openai

  anthropic:
    name: Live Anthropic conformance
    if: ${{ inputs.provider == 'anthropic' || inputs.provider == 'all' }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    steps:
      - name: Validate provider selection
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            openai|anthropic|gemini|xai|mistral|typesafe|all) ;;
            *) echo "provider must be openai, anthropic, gemini, xai, mistral, typesafe, or all" >&2; exit 1 ;;
          esac
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CARGO_AI_SHA" == "$TRUSTED_TRIGGER_SHA" ]] || { echo "Expected candidate differs from workflow ref; select its branch or tag." >&2; exit 1; }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Anthropic check
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model || vars.ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo "ANTHROPIC_API_KEY is required for enrolled Anthropic" >&2; exit 1; }
          [[ -n "${ANTHROPIC_MODEL:-}" ]] || { echo "ANTHROPIC_MODEL is required for enrolled Anthropic" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe anthropic

  gemini:
    name: Live Gemini conformance
    if: ${{ inputs.provider == 'gemini' || (inputs.provider == 'all' && vars.LIVE_GEMINI_ENABLED != '' && vars.LIVE_GEMINI_ENABLED != 'false') }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    steps:
