name: Registry Installation

on:
  workflow_dispatch:
    inputs:
      cargo_ai_sha:
        description: Exact published source commit expected from normal crates.io installation
        required: true
        type: string
  workflow_call:
    inputs:
      cargo_ai_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_AI_DISABLE_KEYCHAIN: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  install:
    name: Registry installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Validate published source identity
        shell: bash
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out published source metadata
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: cargo-ai/cargo-ai
          ref: ${{ inputs.cargo_ai_sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02

      - name: Configure isolated test state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-user-home" "$RUNNER_TEMP/cargo-home"
          {
            echo "HOME=$RUNNER_TEMP/test-user-home"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "RUSTUP_HOME=${RUSTUP_HOME:-${USERPROFILE:-$HOME}/.rustup}"
            echo "RUST_TEST_THREADS=1"
          } >> "$GITHUB_ENV"

      - name: Verify plain registry installation after publication
        shell: bash
        run: |
          set -euo pipefail
          lane="$(cd "$RUNNER_TEMP" && pwd -P)/registry-install"
          evidence="$lane/evidence"
          mkdir -p "$evidence" "$lane/cargo-home" "$lane/home" "$lane/work"
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cargo-ai") | .version')
          candidate=$(git rev-parse HEAD)
          echo "Published candidate: $candidate; workflow revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          host=$(rustc -vV | sed -n 's/^host: //p')
          [[ -n "$version" && -n "$host" ]]
          export CARGO_HOME="$lane/cargo-home"
          export CARGO_TARGET_DIR="$lane/build"
          export CARGO_AI_HOME="$lane/home"
          unset CARGO_ALIAS_AI
          cd "$lane/work"
          {
            echo "candidate=$candidate"
            echo "expected_version=$version"
            echo "platform=$RUNNER_OS"
            echo "observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            rustc -vV
            cargo -vV
          } > "$evidence/identity.txt"
          # Resolve the registry's latest version normally; do not supply a lock,
          # version constraint or force flag. Compiler events identify this build.
          cargo install cargo-ai --registry crates-io --root "$lane/install" --target "$host" --message-format=json > "$evidence/build.jsonl"
          jq -s '[.[] | select(.reason == "compiler-artifact") | {package_id, features, target: {name: .target.name, kind: .target.kind, crate_types: .target.crate_types}, profile, fresh}] | unique_by([.package_id, .target, .features, .profile])' "$evidence/build.jsonl" > "$evidence/compiled-artifacts.json"
          jq -e 'length > 1 and any(.[]; .target.name == "cargo-ai" and (.target.kind | index("bin")))' "$evidence/compiled-artifacts.json" > /dev/null
          jq -s -e 'any(.[]; .reason == "build-finished" and .success == true)' "$evidence/build.jsonl" > /dev/null
          cp "$lane/install/.crates2.json" "$evidence/install-receipt.json"
          unset CARGO_TARGET_DIR
          cli="$lane/install/bin/cargo-ai"
          if [[ "$RUNNER_OS" == "Windows" ]]; then cli="${cli}.exe"; fi
          export PATH="$lane/install/bin:$PATH"
          resolved_cli=$(command -v cargo-ai)
          [[ "${resolved_cli%.exe}" == "${cli%.exe}" ]]
          "$cli" --no-update-check version > "$evidence/direct-version.txt"
          cargo ai --no-update-check version > "$evidence/cargo-dispatch-version.txt"
          [[ "$(cat "$evidence/direct-version.txt")" == "$version" ]]
          [[ "$(cat "$evidence/cargo-dispatch-version.txt")" == "$version" ]]

          archives=("$CARGO_HOME"/registry/cache/*/"cargo-ai-$version.crate")
          [[ "${#archives[@]}" == 1 && -f "${archives[0]}" ]]
          archive="${archives[0]}"
          tar -xOf "$archive" "cargo-ai-$version/.cargo_vcs_info.json" > "$evidence/registry-source.json"
          jq -e --arg candidate "$candidate" '.git.sha1 == $candidate and .git.dirty != true' "$evidence/registry-source.json" > /dev/null
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$archive" "$cli" "$evidence/compiled-artifacts.json" > "$evidence/sha256.txt"
          else
            sha256sum "$archive" "$cli" "$evidence/compiled-artifacts.json" > "$evidence/sha256.txt"
          fi
          cat > smoke.json <<'JSON'
          {
            "agent_definition_schema_version": "2026-09-09.r1",
            "inputs": [{"name": "job", "type": "text", "text": "local installation check"}],
            "agent_schema": {"type": "object", "properties": {}},
            "actions": [{"name": "cargo_version", "logic": {"==": [1, 1]}, "run": [{"kind": "exec", "program": "cargo", "args": ["--version"]}]}]
          }
          JSON
          cargo ai --no-update-check run --config smoke.json --server ollama --model install-smoke --render-mode append-only | tee "$evidence/smoke.txt"
          grep -q 'cargo [0-9]' "$evidence/smoke.txt"
          echo "Plain registry install, exact published source/version, Cargo dispatch and local action passed." >> "$evidence/identity.txt"

      - name: Preserve registry installation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-install-${{ matrix.os }}
          path: ${{ runner.temp }}/registry-install/evidence/
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Registry installation summary
    if: ${{ always() }}
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every native registry installation
        env:
          MATRIX_RESULT: ${{ needs.install.result }}
          PUBLISHED_SHA: ${{ inputs.cargo_ai_sha }}
        run: |
          test "$MATRIX_RESULT" = "success"
          echo "Plain registry installation passed on Linux, macOS and Windows for published source $PUBLISHED_SHA. This run does not publish or qualify other product families." >> "$GITHUB_STEP_SUMMARY"
