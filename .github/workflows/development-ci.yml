name: Development CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_AI_DISABLE_KEYCHAIN: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    name: Development checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the integrated candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated test state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-user-home" "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/cargo-ai-home"
          {
            echo "HOME=$RUNNER_TEMP/test-user-home"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home"
            echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}"
            echo "RUST_TEST_THREADS=1"
          } >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked --bin cargo-ai
      - name: Check qualification decisions
        run: cargo test --locked --test qualification_policy
      - name: Check interpreted provider contracts
        run: cargo test --locked --test provider_smoke
      - name: Describe the verification boundary
        run: |
          echo "Development checks passed for $GITHUB_SHA. Full native, generated-runtime, package and live-provider qualification are separate on-demand checks; select them when the change requires that proof." >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Development security
    uses: ./.github/workflows/security-audit.yml
    with:
      cargo_ai_sha: ${{ github.sha }}
